<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korean Beauty</title>
  <style>
    :root {
      --bg: #f7f3ef;
      --ink: #2b2118;
      --accent: #c45c6a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--ink);
    }

    main {
      max-width: 36rem;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.25rem);
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    p {
      margin-top: 1rem;
      font-family: system-ui, sans-serif;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #5a4c42;
    }

    .accent {
      display: inline-block;
      margin-top: 1.5rem;
      color: var(--accent);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-family: system-ui, sans-serif;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Korean Beauty</h1>
    <p>A simple starting page for skincare, glow, and K-beauty inspiration.</p>
    <span class="accent">Coming soon</span>
  </main>
</body>
</html>
